<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Gradient -->
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2C5F8D;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#bgGrad)"/>

    <!-- Pattern Background -->
    <g opacity="0.1">
        <circle cx="100" cy="100" r="50" fill="white"/>
        <circle cx="1100" cy="530" r="70" fill="white"/>
        <circle cx="200" cy="500" r="40" fill="white"/>
        <circle cx="1000" cy="100" r="60" fill="white"/>
    </g>

    <!-- Main Content -->
    <g transform="translate(100, 150)">
        <!-- Large Form Icon -->
        <rect x="0" y="0" width="200" height="280" rx="16" fill="white"/>
        <rect x="30" y="40" width="140" height="20" rx="10" fill="#E8F1F9"/>
        <rect x="30" y="80" width="140" height="20" rx="10" fill="#E8F1F9"/>
        <rect x="30" y="120" width="100" height="20" rx="10" fill="#E8F1F9"/>
        <rect x="30" y="170" width="30" height="30" rx="6" fill="#E8F1F9"/>
        <rect x="30" y="210" width="30" height="30" rx="6" fill="#4A90E2"/>
        <path d="M38 225 L45 232 L52 218" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- AI Sparkle -->
        <circle cx="180" cy="30" r="40" fill="#FFD700" opacity="0.4"/>
        <path d="M180,5 L187,22 L205,30 L187,38 L180,55 L173,38 L155,30 L173,22 Z" fill="#FFD700"/>
    </g>

    <!-- Text Content -->
    <text x="400" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
        webmcp-forms
    </text>
    <text x="400" y="270" font-family="Arial, sans-serif" font-size="36" fill="white" opacity="0.9">
        AI-Powered Form Tools for WebMCP
    </text>
    <text x="400" y="350" font-family="Arial, sans-serif" font-size="28" fill="white" opacity="0.8">
        ✓ Validation   ✓ Schema Support   ✓ MCP Integration
    </text>

    <!-- Bottom Badge -->
    <rect x="400" y="420" width="300" height="60" rx="30" fill="white" opacity="0.2"/>
    <text x="550" y="460" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">
        Live Demo
    </text>
</svg>